<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Histórico de Vendas | ERP</title>
<script src="/erp-js/initialUi.js?v=erp-ui-1"></script>
<link href="/css/tela.css?v=erp-ui-1" rel="stylesheet"/>
</head>
<body>
<div class="layout">
<aside class="sidebar">
<div class="logo">ERP</div>
<nav class="menu" data-menu-erp="principal" aria-label="Navegação principal"><a href="/dashboard.html">Dashboard</a></nav>
</aside>
<main class="conteudo">
<header class="topo"><span class="usuario"><svg class="erp-icone" aria-hidden="true" focusable="false"><use href="/assets/erp-icons.svg#user"></use></svg><span class="usuario-nome"></span></span><a href="/atendimento.html" class="atalho-atendimento" aria-label="Central de atendimento" title="Central de atendimento" hidden><svg class="erp-icone" aria-hidden="true" focusable="false"><use href="/assets/erp-icons.svg#headset"></use></svg></a><button class="botao secundario" data-logout="" type="button">Sair</button></header>
<script>window.erpUi?.renderizar();</script>

<section class="pagina">
<div class="titulo pagina-titulo"><span class="erp-icone-bloco"><svg class="erp-icone" aria-hidden="true" focusable="false"><use href="/assets/erp-icons.svg#history"></use></svg></span><div class="pagina-titulo-texto"><h1>Histórico de vendas</h1><p>Consulte todas as vendas registradas no ERP e no POS.</p></div></div>
<form class="painel historico-filtros" id="filtrosHistorico">
<div class="campo"><label for="dataHistorico">Pesquisar por dia</label><input id="dataHistorico" name="data" type="date"/></div>
<div class="campo"><label for="inicioHistorico">De</label><input id="inicioHistorico" name="inicio" type="date"/></div>
<div class="campo"><label for="fimHistorico">Até</label><input id="fimHistorico" name="fim" type="date"/></div>
<button class="botao primario" id="buscarHistorico" type="submit">Pesquisar</button>
<button class="botao secundario" id="limparHistorico" type="button">Limpar</button>
<small>Use um dia exato ou um intervalo. Sem datas, todas as vendas aparecem.</small>
</form>
<div class="painel historico-painel">
<div class="historico-topo"><h2>Vendas registradas</h2><span id="resumoHistorico" role="status">Carregando...</span></div>
<div class="historico-tabela-scroll"><table class="tabela"><thead><tr><th>Venda</th><th>Data</th><th>Origem</th><th>Cliente</th><th>Total</th><th></th></tr></thead><tbody id="listaHistorico"><tr><td colspan="6" class="estado-vazio">Carregando vendas...</td></tr></tbody></table></div>
</div>
</section>
</main>
</div>
<dialog class="historico-dialog" id="detalhesVenda" aria-labelledby="tituloDetalhesVenda">
<div class="historico-topo"><h2 id="tituloDetalhesVenda">Detalhes da venda</h2><button class="botao secundario" id="fecharDetalhesVenda" type="button">Fechar</button></div>
<div id="conteudoDetalhesVenda"></div>
<div class="botoes comprovante-acoes"><button class="botao primario" id="imprimirComprovante" type="button" disabled>Imprimir / salvar PDF</button></div>
</dialog>

<script type="module" src="/erp-js/app.js?v=erp-ui-1"></script>
<script type="module" src="/erp-js/historicoVendas.js"></script>
</body>
</html>
