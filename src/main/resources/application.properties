spring.config.import=optional:file:./application-local.properties

# Banco de dados: pode ser informado por application-local.properties ou variáveis de ambiente.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/neondb?sslmode=require}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
erp.auth.jwt-secret=${JWT_SECRET:CodeScript-ERP-JWT-Secret-Key-2026-Escalabilidade}

# Cria/migra a estrutura básica de forma idempotente na inicialização.
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

server.port=8080
server.address=0.0.0.0
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.accept-float-as-int=false

# Assistente IA - Ollama local. Pode ser sobrescrito por application-local.properties.
erp.ia.ollama.enabled=${OLLAMA_ENABLED:true}
erp.ia.ollama.url=${OLLAMA_URL:http://localhost:11434}
erp.ia.ollama.model=${OLLAMA_MODEL:gemma3:4b}
erp.ia.ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:180}

# O front-end oficial é empacotado em classpath:/static; API e telas usam a mesma origem.
spring.web.resources.cache.cachecontrol.no-cache=true

# Evita manter versões antigas de páginas e módulos do front-end no navegador.
spring.web.resources.cache.cachecontrol.no-store=true
