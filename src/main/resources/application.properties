# Configuração atual do backend Spring Boot.
# Em produção, substitua pelos valores de ambiente DATABASE_URL, DB_USER e DB_PASSWORD.
spring.config.import=optional:file:./application-local.properties
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/neondb?sslmode=require}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
server.port=8080
# Permite que outros computadores da mesma rede acessem esta máquina.
server.address=0.0.0.0
spring.jackson.default-property-inclusion=non_null
