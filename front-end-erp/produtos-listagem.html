<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Produtos | ERP</title>
    <link href="./css/tela.css" rel="stylesheet" />
</head>

<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="logo">ERP</div>
            <nav class="menu">
                <a class="" href="dashboard.html">🏠 Dashboard</a>
                <a class="" href="pessoas-listagem.html">👥 Pessoas</a>
                <a class="sub" href="pessoas-cadastro.html">↳ Cadastro</a>
                <a class="sub" href="pessoas-listagem.html">↳ Listagem</a>
                <a class="ativo" href="produtos-listagem.html">📦 Produtos</a>
                <a class="sub" href="produtos-cadastro.html">↳ Cadastro</a>
                <a class="sub" href="produtos-listagem.html">↳ Listagem</a>
                <a class="" href="compras.html">🛒 Compras</a>
                <a class="" href="vendas.html">💰 Vendas</a>
                <a class="" href="estoque.html">📊 Estoque</a>
            </nav>
        </aside>
        <main class="conteudo">
            <header class="topo"><span class="usuario">👤 Usuário ▾</span><button class="botao secundario"
                    data-logout="" type="button">Sair</button></header>
            <section class="pagina">
                <div class="titulo">
                    <h1>Produtos</h1>
                    <p>Consulte produtos e situação do estoque.</p>
                </div>
                <div class="painel">
                    <div class="barra-listagem"><input id="pesquisaProdutos" placeholder="🔍  Pesquisar produto..."
                            type="search" /><a class="botao primario" href="produtos-cadastro.html">+ Novo Produto</a>
                    </div>
                    <table class="tabela">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Produto</th>
                                <th>Preço Venda</th>
                                <th>Estoque</th>
                                <th>Situação</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="listaProdutos"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
    <script src="produtos.js"></script>
</body>

</html>
