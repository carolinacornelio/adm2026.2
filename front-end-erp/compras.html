<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Nova Compra | ERP</title>
    <link href="./css/tela.css" rel="stylesheet" />
</head>

<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="logo">ERP</div>
            <nav class="menu">
                <a class="" href="dashboard.html">🏠 Dashboard</a>
                <a class="" href="pessoas-listagem.html">👥 Pessoas</a>
                <a class="sub" href="pessoas-cadastro.html">↳ Cadastro</a>
                <a class="sub" href="pessoas-listagem.html">↳ Listagem</a>
                <a class="" href="produtos-listagem.html">📦 Produtos</a>
                <a class="sub" href="produtos-cadastro.html">↳ Cadastro</a>
                <a class="sub" href="produtos-listagem.html">↳ Listagem</a>
                <a class="ativo" href="compras.html">🛒 Compras</a>
                <a class="" href="vendas.html">💰 Vendas</a>
                <a class="" href="estoque.html">📊 Estoque</a>
            </nav>
        </aside>
        <main class="conteudo">
            <header class="topo"><span class="usuario">👤 Usuário ▾</span><button class="botao secundario"
                    data-logout="" type="button">Sair</button></header>
            <section class="pagina">
                <div class="titulo">
                    <h1>Nova Compra</h1>
                    <p>Registre uma compra e aumente o estoque automaticamente.</p>
                </div>
                <div class="painel">
                    <form class="formulario" id="formCompra">
                        <div class="linha">
                            <div class="campo"><label>Fornecedor</label><select>
                                    <option value="">Selecione um fornecedor</option>
                                </select></div>
                            <div class="campo"><label>Data</label><input type="date" /></div>
                        </div>
                        <div class="produtos-compra">
                            <table class="tabela">
                                <thead>
                                    <tr>
                                        <th>Produto</th>
                                        <th>Quantidade</th>
                                        <th>Preço Unitário</th>
                                        <th>Total</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr data-item="template">
                                        <td><select name="produto">
                                                <option value="">Selecione um produto</option>
                                            </select></td>
                                        <td><input min="1" name="quantidade" type="number" value="" /></td>
                                        <td><input min="0" name="preco" placeholder="0,00" step="0.01" type="number" />
                                        </td>
                                        <td></td>
                                        <td>❌</td>
                                    </tr>
                                </tbody>
                            </table>
                            <br /><button class="botao secundario" type="button">+ Adicionar produto</button>
                        </div>
                        <div class="total">Total: R$ 0,00</div>
                        <div class="botoes"><a class="botao secundario" href="dashboard.html">Cancelar</a><button
                                class="botao primario" type="button">Finalizar Compra</button></div>
                    </form>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>

</html>
