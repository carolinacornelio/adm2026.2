</head>
<body>
<div class="layout">
<aside class="sidebar">
<div class="logo">ERP</div>
<nav class="menu">
<a class="" href="dashboard.html">🏠 Dashboard</a>
<a class="ativo" href="pessoas-listagem.html">👥 Pessoas</a>
<a class="sub" href="pessoas-cadastro.html">↳ Cadastro</a>
<a class="sub" href="pessoas-listagem.html">↳ Listagem</a>
<a class="" href="produtos-listagem.html">📦 Produtos</a>

<a class="" href="vendas.html">💰 Vendas</a>

</nav>
</aside>
<main class="conteudo">
<header class="topo"><span class="usuario">👤 Usuário ▾</span><button class="botao secundario" data-logout="" type="button">Sair</button></header>
<section class="pagina">
<div class="titulo"><h1>Cadastro de Pessoa</h1><p>Cadastre clientes e fornecedores.</p></div>
<div class="painel">
<form class="formulario" id="formPessoa">
<div class="campo"><label>Nome</label><input name="nome" placeholder="Digite o nome" type="text"/></div>
<div class="campo"><label>CPF/CNPJ</label><input name="documento" placeholder="Digite o CPF ou CNPJ" type="text"/></div>
<div class="linha">
<div class="campo"><label>Telefone</label><input name="telefone" placeholder="Digite o telefone" type="text"/></div>
<div class="campo"><label>E-mail</label><input name="email" placeholder="Digite o e-mail" type="email"/></div>
</div>
<div class="campo"><label>Endereço</label><input name="endereco" placeholder="Digite o endereço" type="text"/></div>
<div class="campo"><label>Tipo</label><select name="tipo"><option>Cliente</option><option>Fornecedor</option><option>Cliente e Fornecedor</option></select></div>
<div class="botoes"><a class="botao secundario" href="dashboard.html">Cancelar</a><button class="botao primario" type="button">Cadastrar</button></div>
</form>
</div>
</section>
</main>
</div>
<script type="module" src="./erp-js/app.js"></script><script type="module" src="./erp-js/pessoas.js"></script></body>
</html>
