<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cadastro de Pessoas | ERP</title>
<script src="/erp-js/initialUi.js?v=erp-ui-1"></script>
<link href="/css/tela.css?v=erp-ui-1" rel="stylesheet"/>
</head>
<body>
<div class="layout">
<aside class="sidebar">
<div class="logo">ERP</div>
<nav class="menu" data-menu-erp="principal" aria-label="Navegação principal"><a href="/dashboard.html">Dashboard</a></nav>
</aside>
<main class="conteudo">
<header class="topo"><span class="usuario"><svg class="erp-icone" aria-hidden="true" focusable="false"><use href="/assets/erp-icons.svg#user"></use></svg><span class="usuario-nome"></span></span><a href="/atendimento.html" class="atalho-atendimento" aria-label="Central de atendimento" title="Central de atendimento" hidden><svg class="erp-icone" aria-hidden="true" focusable="false"><use href="/assets/erp-icons.svg#headset"></use></svg></a><button class="botao secundario" data-logout="" type="button">Sair</button></header>
<script>window.erpUi?.renderizar();</script>

<section class="pagina">
<div class="titulo pagina-titulo"><span class="erp-icone-bloco"><svg class="erp-icone" aria-hidden="true" focusable="false"><use href="/assets/erp-icons.svg#user-plus"></use></svg></span><div class="pagina-titulo-texto"><h1>Cadastro de Pessoa</h1><p>Cadastre clientes e fornecedores.</p></div></div>
<div class="painel">
<form class="formulario" id="formPessoa">
<div class="campo"><label>Nome</label><input name="nome" placeholder="Digite o nome" type="text"/></div>
<div class="campo"><label>CPF/CNPJ</label><input name="documento" placeholder="Digite o CPF ou CNPJ" type="text"/></div>
<div class="linha">
<div class="campo"><label>Telefone</label><input name="telefone" placeholder="Digite o telefone" type="text"/></div>
<div class="campo"><label>E-mail</label><input name="email" placeholder="Digite o e-mail" type="email"/></div>
</div>
<div class="campo"><label>Endereço</label><input name="endereco" placeholder="Digite o endereço" type="text"/></div>
<div class="campo"><label>Tipo</label><select name="tipo"><option>Cliente</option><option>Fornecedor</option><option>Cliente e Fornecedor</option></select></div>
<div class="botoes"><a class="botao secundario" href="/dashboard.html">Cancelar</a><button class="botao primario" type="submit">Cadastrar</button></div>
</form>
</div>
</section>
</main>
</div>

<script type="module" src="/erp-js/app.js?v=erp-ui-1"></script><script type="module" src="/erp-js/pessoas.js"></script></body>
</html>
