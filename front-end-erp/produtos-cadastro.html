<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cadastro de Produtos | ERP</title>
<script src="/erp-js/initialUi.js?v=erp-ui-1"></script>
<link href="/css/tela.css?v=erp-ui-1" rel="stylesheet"/>
</head>
<body>
<div class="layout">
<aside class="sidebar">
<div class="logo">ERP</div>
<nav class="menu" data-menu-erp="principal" aria-label="Navegação principal"><a href="/dashboard.html">Dashboard</a></nav>
</aside>
<main class="conteudo">
<header class="topo"><span class="usuario"><svg class="erp-icone" aria-hidden="true" focusable="false"><use href="/assets/erp-icons.svg#user"></use></svg><span class="usuario-nome"></span></span><a href="/atendimento.html" class="atalho-atendimento" aria-label="Central de atendimento" title="Central de atendimento" hidden><svg class="erp-icone" aria-hidden="true" focusable="false"><use href="/assets/erp-icons.svg#headset"></use></svg></a><button class="botao secundario" data-logout="" type="button">Sair</button></header>
<script>window.erpUi?.renderizar();</script>

<section class="pagina">
<div class="titulo pagina-titulo"><span class="erp-icone-bloco"><svg class="erp-icone" aria-hidden="true" focusable="false"><use href="/assets/erp-icons.svg#package-plus"></use></svg></span><div class="pagina-titulo-texto"><h1>Cadastro de Produto</h1><p>Cadastre os produtos comercializados.</p></div></div>
<div class="painel">
<form class="formulario" id="formProduto">
<div class="campo"><label>Nome</label><input name="nome" placeholder="Digite o nome do produto" type="text"/></div>
<div class="campo"><label>Código</label><input name="codigo" placeholder="Digite o código" type="text"/></div>
<div class="campo"><label>Descrição</label><textarea name="descricao" placeholder="Digite a descrição"></textarea></div>
<div class="linha">
<div class="campo"><label>Preço de Compra</label><input min="0" name="precoCompra" placeholder="0,00" step="0.01" type="number"/></div>
<div class="campo"><label>Preço de Venda</label><input min="0" name="precoVenda" placeholder="0,00" step="0.01" type="number"/></div>
</div>
<div class="linha">
<div class="campo categoria-campo">
<label for="categoriaProduto">Categoria <span class="plano-badge">Intermediário+</span></label>
<div class="campo-com-acao"><select id="categoriaProduto" name="categoriaId" data-plano-minimo="PLUS"><option value="">Carregando categorias...</option></select><button class="acao-mini" id="mostrarNovaCategoria" data-plano-minimo="PLUS" type="button">+ Nova</button></div>
<small class="ajuda-campo">Ex.: Celular, Computador, Periférico ou Acessório.</small>
<div class="nova-categoria" id="novaCategoria" hidden><input id="nomeNovaCategoria" maxlength="100" placeholder="Nome da nova categoria" type="text"/><button class="acao-mini" id="salvarNovaCategoria" type="button">Salvar</button></div>
</div>
<div class="campo"><label>Estoque Mínimo</label><input min="0" name="estoqueMinimo" placeholder="0" step="1" type="number"/></div>
</div>
<div class="campo"><label for="controlaValidade">Controle de validade</label><select id="controlaValidade" name="controlaValidade"><option value="false">Sem validade obrigatória</option><option value="true">Perecível — exigir lote e validade nas compras</option></select></div>
<div class="botoes"><a class="botao secundario" href="/dashboard.html">Cancelar</a><button class="botao primario" type="submit">Cadastrar</button></div>
</form>
</div>
</section>
</main>
</div>

<script type="module" src="/erp-js/app.js?v=erp-ui-1"></script><script type="module" src="/erp-js/produtos.js?v=erp-ui-1"></script></body>
</html>
